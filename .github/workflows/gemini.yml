name: Gemini CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  analyze:
    name: Analyze with Gemini
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Review the code changes in this pull request or commit.
            - Summarize the main changes.
            - Identify potential bugs or logical errors.
            - Suggest improvements for readability or performance.
            - Check for security vulnerabilities.
            - Ensure consistency with the project's architecture as described in GEMINI.md.
